name: Windows trusted distribution

on:
  push:
    branches: [main, 'codex/m1-s-trusted-distribution', 'codex/m1-2-file-management', 'codex/m2-image-conversion']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-distribution-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_DOTNET_SDK: '10.0.404'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  ARTIFACT_NAME: UniversalConverter-Windows-x64-SingleFile-Unsigned-Test
  PACKAGE_LAYOUT: single-file

jobs:
  candidate:
    name: Test and inventory Windows x64 Single-file
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      candidate-id: ${{ steps.upload.outputs.artifact-id }}
      zip-sha256: ${{ steps.candidate.outputs.zip_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release source
        id: source
        shell: pwsh
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the checked out commit.' }
          $eventCommit = git rev-parse "$($env:GITHUB_SHA)^{commit}"
          if ($LASTEXITCODE -ne 0 -or $commit -ne $eventCommit) { throw 'Commit does not match the workflow source.' }
          $version = '0.1.0-ci'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REPOSITORY -ne 'EnesKaleci/UniversalConverter' -or $env:REF_PROTECTED -ne 'true' -or
                $env:GITHUB_REF_NAME -cnotmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw 'A version tag in the project repository protected by a release ruleset is required.'
            }
            $tagCommit = git rev-parse "$($env:GITHUB_REF)^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $commit) { throw 'The tag resolves to a different commit.' }
            git merge-base --is-ancestor $commit refs/remotes/origin/main
            if ($LASTEXITCODE -ne 0) { throw 'The release commit must be in reviewed main history.' }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          if ($env:GITHUB_REF_NAME -eq 'codex/m1-2-file-management') {
            $env:ARTIFACT_NAME = 'UniversalConverter-M1.2-Windows-x64-SingleFile-Unsigned-Development-Test'
          }
          if ($env:GITHUB_REF_NAME -eq 'codex/m2-image-conversion') {
            $env:ARTIFACT_NAME = 'UniversalConverter-M2-Windows-x64-SingleFile-Unsigned-Development-Test'
          }
          "ARTIFACT_NAME=$env:ARTIFACT_NAME" >> $env:GITHUB_ENV
          "package_name=$env:ARTIFACT_NAME" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "PACKAGE_TEST_ROOT=$(Join-Path $env:RUNNER_TEMP 'converter-windows-release-smoke')" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/converter-release-dotnet
        with:
          dotnet-version: ${{ env.RELEASE_DOTNET_SDK }}
          architecture: x64
          skip-lts-prepass: true
      - name: Check SDK and restore profile
        shell: pwsh
        run: |
          if ((dotnet --version) -ne $env:RELEASE_DOTNET_SDK) { throw 'Unexpected release SDK.' }
          dotnet restore UniversalConverter.slnx -p:WindowsReleaseProfile=true
      - name: Build and test release profile
        shell: pwsh
        run: |
          dotnet build UniversalConverter.slnx -c Release --no-restore -p:WindowsReleaseProfile=true
          if ($LASTEXITCODE -ne 0) { throw 'Release-profile build failed.' }
          dotnet test UniversalConverter.slnx -c Release --no-build -p:WindowsReleaseProfile=true --logger trx --results-directory artifacts/test-results
      - name: Publish self-contained Windows x64 Single-file
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: >
          dotnet publish src/UniversalConverter.Desktop -c Release -r win-x64 --self-contained true
          -p:WindowsReleaseProfile=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false -p:ContinuousIntegrationBuild=true -p:IncludeSourceRevisionInInformationalVersion=false
          "-p:Version=$env:RELEASE_VERSION" -o artifacts/publish
      - name: Test extracted ZIP, startup and both languages
        id: candidate
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          ./.github/scripts/Test-WindowsPortable.ps1 -WindowsReleaseProfile
          $exe = Get-Item -LiteralPath (Join-Path $env:PACKAGE_TEST_ROOT 'extracted/UniversalConverter.Desktop.exe')
          if ($exe.VersionInfo.ProductName -cne 'Universal Converter' -or
              $exe.VersionInfo.ProductVersion -cne $env:RELEASE_VERSION) {
            throw 'Packaged EXE metadata does not match the release build.'
          }
          & powershell.exe -NoProfile -NonInteractive -File ./.github/scripts/Test-WindowsLocalization.ps1 -FileManagement -ImageConversion
          if ($LASTEXITCODE -ne 0) { throw 'Windows localization smoke test failed.' }
          $zip = "artifacts/$($env:ARTIFACT_NAME).zip"
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          "zip_sha256=$hash" >> $env:GITHUB_OUTPUT
          "Unsigned test ZIP SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
      - name: Inventory native DLLs and require valid upstream signatures
        shell: pwsh
        run: |
          ./.github/scripts/Write-WindowsNativeInventory.ps1 -BundleCache (Join-Path $env:PACKAGE_TEST_ROOT 'diagnostic-bundle') -OutputPath artifacts/native-authenticode.csv
      - name: Verify that the signing gate rejects the unsigned build
        shell: pwsh
        run: |
          Import-Module ./.github/scripts/WindowsAuthenticode.psm1
          $exe = Join-Path $env:PACKAGE_TEST_ROOT 'extracted/UniversalConverter.Desktop.exe'
          try {
            $null = Assert-WindowsReleaseSignature -UnsignedPath $exe -SignedPath $exe -CertificateSha256 ('0' * 64)
            throw 'The release gate accepted an unsigned executable.'
          } catch {
            if ($_.Exception.Message -notlike 'Expected a valid embedded Authenticode signature*NotSigned*') { throw }
            Write-Host 'The unsigned EXE was rejected as expected.'
          }
      - name: Upload native inventory, xUnit and startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-Release-Profile-Verification-${{ github.run_attempt }}
          path: |
            artifacts/test-results/*.trx
            artifacts/native-authenticode.csv
            artifacts/publish/authenticode.csv
            ${{ runner.temp }}/converter-windows-release-smoke/*-data/logs/startup-*.log
          if-no-files-found: ignore
      - name: Upload unsigned test package
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.source.outputs.package_name }}-${{ github.run_attempt }}
          path: |
            artifacts/${{ steps.source.outputs.package_name }}.zip
            artifacts/${{ steps.source.outputs.package_name }}.zip.sha256
            artifacts/native-authenticode.csv
          if-no-files-found: error
          compression-level: 0

  sign:
    name: Sign and verify Windows release candidate
    needs: candidate
    if: github.ref_type == 'tag' && github.repository == 'EnesKaleci/UniversalConverter'
    runs-on: windows-2025
    timeout-minutes: 35
    environment: windows-signing
    permissions:
      actions: read
      contents: read
    outputs:
      signed-id: ${{ steps.upload.outputs.artifact-id }}
      zip-name: ${{ steps.package.outputs.zip_name }}
      zip-sha256: ${{ steps.package.outputs.zip_sha256 }}
    steps:
      - name: Require authorized signing configuration
        shell: pwsh
        env:
          WINDOWS_SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_SLUG: ${{ vars.SIGNPATH_ARTIFACT_SLUG }}
          SIGNING_CERT_SHA256: ${{ vars.WINDOWS_SIGNING_CERT_SHA256 }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ($env:WINDOWS_SIGNING_PROVIDER -cne 'signpath' -or
              [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID) -or
              [string]::IsNullOrWhiteSpace($env:SIGNPATH_PROJECT_SLUG) -or
              [string]::IsNullOrWhiteSpace($env:SIGNPATH_POLICY_SLUG) -or
              [string]::IsNullOrWhiteSpace($env:SIGNPATH_ARTIFACT_SLUG) -or
              $env:SIGNING_CERT_SHA256 -notmatch '^[a-fA-F0-9]{64}$' -or
              [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw 'Authorized SignPath configuration is required. No signing request was sent.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.candidate.outputs.candidate-id }}
          path: unsigned
      - name: Stage only the built EXE for the provider
        shell: pwsh
        env:
          UNSIGNED_HASH: ${{ needs.candidate.outputs.zip-sha256 }}
        run: |
          $zipPath = (Resolve-Path -LiteralPath "unsigned/$($env:ARTIFACT_NAME).zip").Path
          if ((Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash -ne $env:UNSIGNED_HASH) {
            throw 'Unsigned ZIP hash differs from the build job.'
          }
          $inputRoot = Join-Path $env:RUNNER_TEMP 'signing-input'
          [IO.Compression.ZipFile]::ExtractToDirectory($zipPath, $inputRoot)
      - name: Upload provider input
        id: provider-input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-EXE-Signing-Input-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signing-input/UniversalConverter.Desktop.exe
          if-no-files-found: error
          retention-days: 2
      - name: Submit EXE for signing
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_SLUG }}
          github-artifact-id: ${{ steps.provider-input.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.candidate.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: ${{ runner.temp }}/signing-output
      - name: Verify Authenticode, RFC 3161, bundle identity and signed ZIP
        id: package
        shell: pwsh
        env:
          UNSIGNED_HASH: ${{ needs.candidate.outputs.zip-sha256 }}
          SIGNING_CERT_SHA256: ${{ vars.WINDOWS_SIGNING_CERT_SHA256 }}
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.candidate.outputs.commit }}
        run: |
          ./.github/scripts/New-WindowsSignedRelease.ps1 -UnsignedZip "unsigned/$($env:ARTIFACT_NAME).zip" -UnsignedZipSha256 $env:UNSIGNED_HASH -SignedDirectory (Join-Path $env:RUNNER_TEMP 'signing-output') -NativeInventory unsigned/native-authenticode.csv -CertificateSha256 $env:SIGNING_CERT_SHA256 -Version $env:RELEASE_VERSION -SourceCommit $env:SOURCE_COMMIT -OutputDirectory verified-release
      - name: Upload signed candidate for Windows acceptance
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-x64-Signed-Acceptance-Candidate-${{ github.run_attempt }}
          path: verified-release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish verified ZIP after real Windows acceptance
    needs: [candidate, sign]
    if: github.ref_type == 'tag' && github.repository == 'EnesKaleci/UniversalConverter'
    runs-on: windows-2025
    timeout-minutes: 10
    environment: windows-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.signed-id }}
          path: verified-release
      - name: Publish verified assets to the protected tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ needs.sign.outputs.zip-name }}
          ZIP_SHA256: ${{ needs.sign.outputs.zip-sha256 }}
          SOURCE_COMMIT: ${{ needs.candidate.outputs.commit }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:GITHUB_REF_NAME
          $zip = Join-Path verified-release $env:ZIP_NAME
          if ($env:ZIP_SHA256 -notmatch '^[a-fA-F0-9]{64}$' -or
              (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $env:ZIP_SHA256 -or
              (Get-Content -LiteralPath "$zip.sha256" -Raw).Trim() -cne "$($env:ZIP_SHA256)  $($env:ZIP_NAME)") {
            throw 'The approved release asset or its manifest changed.'
          }
          $reviews = gh api "repos/$repo/actions/runs/$($env:GITHUB_RUN_ID)/approvals" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify Windows acceptance approval.' }
          $requiredComment = "WINDOWS-SAC-PASS $($env:ZIP_SHA256)"
          $accepted = @($reviews | Where-Object {
            $_.state -eq 'approved' -and $_.environments.name -contains 'windows-release' -and $_.comment -ceq $requiredComment
          })
          if ($accepted.Count -eq 0) { throw 'A windows-release reviewer must record successful Windows Smart App Control acceptance for this ZIP hash.' }
          $remote = gh api "repos/$repo/git/ref/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the remote tag.' }
          if ($remote.object.type -eq 'tag') {
            $object = gh api "repos/$repo/git/tags/$($remote.object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the annotated tag.' }
          } else { $object = $remote }
          if ($object.object.type -ne 'commit' -or $object.object.sha -ne $env:SOURCE_COMMIT) {
            throw 'The protected tag no longer points to the approved source.'
          }
          $notes = "Windows x64 signed Single-file. Source: $($env:SOURCE_COMMIT). ZIP SHA-256: $($env:ZIP_SHA256)."
          gh release create $tag $zip "$zip.sha256" --repo $repo --verify-tag --draft --title "Universal Converter $tag" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the verified GitHub Release.' }
          gh release edit $tag --repo $repo --draft=false
